name: shakespeare
description: A quiet space for original words, in every language.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.9 <4.0.0'
  flutter: '>=3.38.10'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: 1.0.8
  http: 1.6.0
  shared_preferences: 2.5.3
  share_plus: 12.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  shaders:
    - shaders/liquid_orb.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic.ttf
    - family: Hebrew
      fonts:
        - asset: assets/fonts/NotoSansHebrew.ttf
