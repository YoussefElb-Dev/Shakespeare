name: AI gateway
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Verify build configuration and signing gates
        working-directory: .
        run: python3 -m unittest discover -s scripts/ci -p '*_test.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.0'
          package_json_file: backend/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check
