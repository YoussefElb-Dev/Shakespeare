name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_aab:
        description: Also build a Play Store AAB (requires release signing)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17.0.17+10'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ runner.os }}-${{ hashFiles('android/**/*.kts', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format, analyze, and test
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test test_driver
          flutter analyze --fatal-infos
          flutter test --coverage
      - name: Configure release signing
        if: github.event_name != 'pull_request'
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/ci/android_sign.py
      - name: Resolve build configuration
        id: config
        env:
          QUOTE_API_URL: ${{ secrets.QUOTE_API_URL || vars.QUOTE_API_URL }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: python3 scripts/ci/configure_build.py
      - name: Compile APK and optional AAB
        env:
          QUOTE_API_URL: ${{ secrets.QUOTE_API_URL || vars.QUOTE_API_URL }}
          PREVIEW: ${{ steps.config.outputs.preview }}
          BUILD_VERSION: ${{ steps.config.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          BUILD_AAB: ${{ inputs.build_aab || github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          args=(--release --build-number="$GITHUB_RUN_NUMBER" "--dart-define=QUOTE_API_URL=$QUOTE_API_URL" "--dart-define=PREVIEW_MODE=$PREVIEW")
          if [[ -n "$BUILD_VERSION" ]]; then args+=(--build-name="$BUILD_VERSION"); fi
          flutter build apk "${args[@]}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Shakespeare-Android.apk
          if [[ "$BUILD_AAB" == 'true' && "$SIGNED" == 'true' ]]; then
            flutter build appbundle "${args[@]}"
            cp build/app/outputs/bundle/release/app-release.aab dist/Shakespeare-Android.aab
          fi
          (cd dist && sha256sum Shakespeare-Android.* > Shakespeare-Android.sha256)
          echo '### Build output' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the APK from this run’s Artifacts section. A preview APK is signed with a disposable debug key; a production APK uses your configured release keystore.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload successful Android outputs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.signed == 'true' && 'Shakespeare-Android' || 'Shakespeare-Android-preview' }}
          path: dist/Shakespeare-Android.*
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/shakespeare-release.jks"
      - name: Report failure
        if: failure()
        run: echo 'Android validation or compilation failed. No build is published. Inspect the first failed step above.' >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: build
    if: github.ref_type == 'tag' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Shakespeare-Android
          path: release-artifacts
      - name: Attach signed outputs to versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/publish_release.py
